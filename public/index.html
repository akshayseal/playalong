<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XM Playalong</title>
<link rel="icon" href="/xm-logo.png">
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="qp-app" style="text-align:center; padding-top:80px">
  <div class="qp-brand" style="justify-content:center; margin-bottom:24px; cursor:default">
    <img class="mark" src="/xm-logo.png" alt=""><span style="font-size:28px">XM Playalong</span>
  </div>
  <div class="qp-card">
    <h2>Are you playing, or running the show?</h2>
    <div class="qp-row" style="margin-top:16px">
      <a href="/player/" class="qp-btn block">I'm playing</a>
      <a href="/quizmaster/" class="qp-btn ghost block">I'm the quizmaster</a>
    </div>
  </div>
</div>
</body>
</html>
